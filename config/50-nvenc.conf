[Service]
ExecStart=
ExecStart=/usr/bin/sh -ec 'if [ -f "$1/libKPipeWireRecord.so.6" ] && [ -r "$1/libKPipeWireRecord.so.6" ] && [ "$$(/usr/bin/readlink -f /usr/lib/libKPipeWireRecord.so.6)" = /usr/lib/libKPipeWireRecord.so.6.8.3 ]; then export LD_LIBRARY_PATH="$1" KPIPEWIRE_FORCE_ENCODER=h264_nvenc; fi; exec /usr/bin/krdpserver' krdp %h/.local/lib/krdp-nvenc/6.8.3
